# Netlify Configuration for Frontend
[build]
  base = "frontend/"
  command = "npm run build"
  publish = "dist/"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/models/*"
  to = "https://YOUR_BACKEND_URL/models/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/agents/*"
  to = "https://YOUR_BACKEND_URL/agents/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/projects/*"
  to = "https://YOUR_BACKEND_URL/projects/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/system/*"
  to = "https://YOUR_BACKEND_URL/system/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws"
  to = "wss://YOUR_BACKEND_URL/ws"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200