# Model Registry Configuration
# Primary/fallback routes per agent

agents:
  planner:
    primary:
      provider: "nvidia"
      model: "nvidia/nemotron-3-ultra"
      temperature: 0.3
      max_tokens: 8192
    fallbacks:
      - provider: "openai_compatible"
        model: "gpt-4o"
        temperature: 0.3
      - provider: "local"
        model: "llama-3.1-70b-instruct"
        temperature: 0.3
  
