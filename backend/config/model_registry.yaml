# Global provider defaults
providers:
  nvidia:
    enabled: true
    timeout: 60
    max_retries: 3
    rate_limit_rpm: 100
  
  openai_compatible:
    enabled: true
    timeout: 60
    max_retries: 3
    rate_limit_rpm: 60
  
  local:
    enabled: true
    timeout: 120
    max_retries: 1
    rate_limit_rpm: 10

# Health check configuration
health_check:
  interval_seconds: 30
  timeout_seconds: 10
  failure_threshold: 3
  success_threshold: 2
  cooldown_seconds: 300