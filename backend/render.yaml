# Render Blueprint - Infrastructure as Code
# Deploy: Push to GitHub → Render Dashboard → New Blueprint Instance
# Or: render deploy --image

services:
  # Main Web Service (FastAPI + WebSockets)
  - type: web
    name: nvidia-multi-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /system/health/live
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      # Set these in Render Dashboard after creation:
      # - key: DATABASE_URL
      #   sync: false
      # - key: NVIDIA_API_KEY
      #   sync: false
      # - key: SECRET_KEY
      #   sync: false
      # - key: ENCRYPTION_KEY
      #   sync: false
    # Auto-deploy on push to main
    autoDeploy: true

  # Background Worker (Scheduler/Orchestrator)
  - type: worker
    name: nvidia-multi-agent-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    # Run the scheduler/orchestrator
    startCommand: python -m nvidia_multi_agent_builder.worker
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Same env vars as web service
    autoDeploy: true

# Optional: Redis for caching/pubsub (if needed)
# databases:
#   - name: nvidia-multi-agent-redis
#     type: redis
#     plan: free
#     region: oregon